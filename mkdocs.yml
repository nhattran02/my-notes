site_name: Linux Notes
site_description: Personal notes and references for Embedded Linux development.
site_url: https://nhattran02.github.io/my-notes

repo_name: nhattran02/my-notes
repo_url: https://github.com/nhattran02/my-notes

theme:
  name: material

  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

  # Light / dark toggle, styled after the Textual docs:
  # white header with purple accent in light mode, black header in dark mode.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  language: en

copyright: '&copy;2026 Nhat Tran'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nhattran02
      name: nhattran02 on GitHub

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md

  # Each top-level entry is a tab in the header bar.
  - Guides:
      - guides/index.md
      - Flash the bootloader: guides/flash-bootloader.md
      - TFTP / NFS boot: guides/nfs-boot.md
      - SD card / eMMC boot: guides/sd-emmc-boot.md

  - BSP Manual:
      - bsp/index.md
      - MTU3 PWM: bsp/mtu3-pwm.md

  - Boards:
      - boards/index.md
      - RZ/G2L SMARC EVK: boards/rzg2l-smarc.md
      - RZ/G3S SMARC EVK: boards/rzg3s-smarc.md
      - RZ/V2N EVK: boards/rzv2n-evk.md
