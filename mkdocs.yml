site_name: Linux Notes
site_description: Personal notes and references for Embedded Linux development.
site_url: https://nhattran02.github.io/my-notes

repo_name: nhattran02/my-notes
repo_url: https://github.com/nhattran02/my-notes

theme:
  name: material
  custom_dir: overrides

  features:
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.integrate
    - toc.follow

  nav_top:
    no_title: false

  palette:
    primary: custom

  language: en

copyright: '&copy;2026 Nhat Tran'

extra:
  header_link: true
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nhattran02
      name: nhattran02 on GitHub

extra_css:
  - stylesheets/extra.css
  - stylesheets/card.css

extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      preserve_tabs: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md

  - RZ/G2L SMARC:
      - g2l/index.md
      - Flash bootloader: g2l/001boot.md
      - TFTP NFS Booting: g2l/002nfs.md
      - SD Card / eMMC Booting: g2l/003sd_emmc.md

  - RZ/V2N EVK:
      - v2n/index.md

  - RZ/G3S EVK:
      - g3s/index.md

  - Yocto:
      - yocto/index.md
      - Host setup: yocto/host-setup.md
      - Build the BSP: yocto/build-bsp.md
      - Build output: yocto/deploy-output.md
